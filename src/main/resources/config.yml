###################################################
# +---------------------------------------------+ #
# |             Database Connection             | #
# +---------------------------------------------+ #
###################################################

# CAUTION! Developer mode will drop all database tables on startup. DO NOT USE IN PRODUCTION.
developer-mode: false

# Database connection settings.
mysql:
  host: localhost
  port: 3306
  username: unitedregions
  password: unitedregions
  database: unitedregions

general:

  # Worlds where UnitedLands commands can be used
  worlds:
    - world_earth

  new-day:
    # Start a new day at regular intervals instead of a fixed real-world time.
    use-interval: false
    # The length of one day (in seconds). Only used when use-new-day-interval is true
    interval-seconds: 3600
    # When use-new-day-interval is false, this will be the server time at which a new day 
    # starts. Must be hh:mm in 24-hour-format (e.g. 17:35)
    new-day-time: "12:00"

  # How long does a player need to be online in order add to their playtime (in seconds). If the time between logon and logoff is
  # less than this, their activity will not be logged and their playtime will not be increased.
  playtime-record-threshold: 5

  # Should land unclaimed land in owned regions / regionless areas be protected by default?
  protect-unclaimed-land: true

  # Should settlements be able to claim across region borders?
  allow-settlement-claims-outside-home-region: false

  # Whether players should gain hunger in their own settlement
  prevent-hunger-in-settlement: true

  # Manage flight permissions
  flight:
    # Enable or disable flight management
    enabled: true
    # Required permissions to use flight command (any of the following)
    permissions: 
    - townyflight.command.tfly
    - united.lands.flight
    # Permissions that will override the cancellation of flight in non-trusted settlements (any of the following)
    any-settlement-override-permission:
    - group.admin
    - group.moderator
    # Permissions that will override the cancellation of flight outside of claimed areas (any of the following)
    wilderness-override-permission:
    - group.admin
    - group.moderator
    # Permissions that will override the cancellation of flight in non-UL-managed worlds (any of the following)
    dimension-override-permission:
    - group.admin

    

import:
  # Scale multiplier for the import SVG
  scale: 1
  # Offsets to be subtracted from the imported vertex positions. These will usually be
  # half of the map width / height
  offset-x: 0
  offset-y: 0


  # Default map colors
  # Colours as int values (e.g. https://argb-int-calculator.netlify.app/)
  # Default map colors & styles

map-rendering:
  settlement-default:
    fill: 550950614
    stroke: -2697514
    width: 2
    dash: "0"
  settlement-in-country:
    fill: 0
    stroke: 0
    width: 2
    dash: "4,4"
  region-default:
    fill: 1610612736
    stroke: 0
    width: 1
    dash: "0"
  region-in-country:
    fill: 0
    stroke: 0
    width: 1
    dash: "1,3"
  country-default:
    fill: 540248319
    stroke: -13399809
    width: 3
    dash: "0"

economy:

  taxes:
    settlement:
      # Min and max percentage for citizen taxation
      min-percent: 0.0
      max-percent: 1.0
    country:
      # Min and max percentage for settlement taxation
      min-percent: 0.0
      max-percent: 1.0

  costs:
    settlement:
      create: 8000
      # The balance that a settlement's bank must meet after bankruptcy to stop the removal process
      bankruptcy-stop-threshold: 5000
      # How many seconds must have passed since bankruptcy to trigger removal
      bankruptcy-grace-period: 259195
      plot-claim-base: 48
      plot-claim-cost-formula: "base"
      plot-upkeep-base: 3
      upkeep-per-plot-formula: "base"
    country:
      create: 80000
      # The balance that a country's bank must meet after bankruptcy to stop the removal process
      bankruptcy-stop-threshold: 10000 
      bankruptcy-grace-period: 259195
      region-claim-base: 10000
      region-claim-cost-formula: "base + (base * 0.1 * (distance / 512))"
      region-upkeep-base: 250
      region-upkeep-formula: "base + (base * 0.1 * (distance / 512))"

# These attributes will be attached to all settlements and countries automatically
geopol-attribute-defaults:
  settlement:
    CLAIM_DISCOUNT:
      display: "Claim cost reduction"
      current-value: 0
      max-value: 0
      min-value: 0
      daily-change: 0
    UPKEEP_DISCOUNT:
      display: "Upkeep reduction"
      current-value: 0
      max-value: 0
      min-value: 0
      daily-change: 0
  country:
    CLAIM_DISCOUNT:
      display: "Claim cost reduction"
      current-value: 0
      max-value: 0
      min-value: 0
      daily-change: 0
    UPKEEP_DISCOUNT:
      display: "Upkeep reduction"
      current-value: 0
      max-value: 0
      min-value: 0
      daily-change: 0
    REGION_CLAIM_TIME:
      display: "Time to claim a region (seconds)"
      current-value: 86400
      max-value: 0
      min-value: 0
      daily-change: 0
    MAX_PARELLEL_CLAIMS:
      display: "Maximum parallel region claims"
      current-value: 1
      max-value: 0
      min-value: 0
      daily-change: 0


