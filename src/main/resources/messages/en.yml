admin:
  country:
    addrank:
      success: <aqua>Successfully added rank {1} to {2} in country {3}.</aqua>
    addsettlement:
      settlement-has-country: <yellow>{1} is already in a country.</yellow>
      not-country-region: <yellow>{1} is outside of the country's territory.</yellow>
      success: <aqua>Successfully added {1} to {2}.</aqua>
    citzen-not-in-country: <yellow>{1} is not a citizen of country {2}</yellow>
    claim:
      already-claimed: <yellow>Region {1} is already claimed by {2}.</yellow>
      no-region: <yellow>Region {1} does not exist.</yellow>
      success: <aqua>Successfully started claiming of {1} for {2}.</aqua>
    create:
      no-region: <yellow>{1} is not in any region.</yellow>
      already-in-country: <yellow>{1} is already part of a country.</yellow>
      region-occupied: <yellow>{1} is not in an unowned region.</yellow>
      success: <aqua>Successfully created {1} with capital {2} in region {3}.</aqua>
    delete:
      success: <aqua>Country {1} successfully deleted.</aqua>
    removerank:
      success: <aqua>Successfully removed rank {1} from {2} in country {3}.</aqua>
    removesettlement:
      not-in-country: <yellow>{1} is not part of the country.</yellow>
      success: <aqua>Successfully removed {1} from {2}.</aqua>
    setcapital:
      settlement-not-in-country: <yellow>{1} is not in country {2}.</yellow>
      success: <aqua>Successfully changed the capital of {1} to {2}.</aqua>
    setcolor:
      success: <aqua>Successfully changed color of {1} to {2}.</aqua>
    setname:
      success: <aqua>Successfully changed name of {1} to {2}.</aqua>
    unclaim:
      not-claimed: <yellow>Region {1} is not claimed.</yellow>
      success: <aqua>Successfully unclaimed region {1} from {2}</aqua>
    unknown-rank: "<yellow>Unknown rank: {1}</yellow>"
  settlement:
    addcitizen:
      already-in-settlement: <yellow>{1} is already part of {2}.</yellow>
      success: <aqua>Successfully added {1} to {2}.</aqua>
    addrank:
      success: <aqua>Successfully added rank {1} to {2} in settlement {3}.</aqua>
    citizen-not-in-settlement: <yellow>{1} is not a citizen of {2}.</yellow>
    claim:
      already-claimed: <yellow>This chunk is already claimed.</yellow>
      success: <aqua>Chunk {1} claimed for {2}.</aqua>
    create:
      already-claimed: <yellow>This chunk is already claimed.</yellow>
      success: <aqua>Successfully created settlement {1}.</aqua>
    delete:
      is-capital: <yellow>Cannot delete a capital.</yellow>
      success: <aqua>Successfully deleted settlement {1}.</aqua>
    removecitizen:
      success: <aqua>Successfully removed {1} from settlement {2}.</aqua>
    removerank:
      success: <aqua>Successfully removed rank {1} from {2} in settlement {3}.</aqua>
    setname:
      success: <aqua>Successfully changed name of {1} to {2}.</aqua>
    setspawn:
      not-in-claims: <yellow>Location is not inside settlement claims.</yellow>
      success: <aqua>Successfully changed the spawn of {1}.</aqua>
    unclaim:
      has-spawn: <yellow>Cannot unclaim the chunk that contains the settlement spawn. Move the spawn first.</yellow>
      has-visitor-spawn: <yellow>Cannot unclaim the chunk that contains the settlement visitor spawn. Move the spawn first.</yellow>
      is-home-chunk: <yellow>Cannot unclaim the settlement home chunk.</yellow>
      not-claimed: <yellow>This chunk is not claimed.</yellow>
      success: <aqua>Chunk {1} of {2} unclaimed.</aqua>
    unknown-rank: "<yellow>Unknown rank: {1}</yellow>"
  towny:
    import:
      error: <red>Error while importing Towny data. Please review the console.</red>
      finished: <aqua>Import finished.</aqua>
      success-country: <aqua>Country import finished.</aqua>
      success-settlement: <aqua>Settlement import finished.</aqua>
general-errors:
  citizen-not-found: <yellow>Citizen {1} not found.</yellow>
  country-not-found: <yellow>Country {1} not found.</yellow>
  damage-disabled: <yellow>You cannot do any damage here.</yellow>
  no-citizen-data: <yellow>Missing citizen data for player {1}.</yellow>
