      no-region: <yellow>This settlement does not belong to any region.</yellow>
    kick:
      cannot-kick-yourself: <yellow>You can't kick yourself from the settlement.</yellow>
      is-leader: <yellow>You can't kick the country leader.</yellow>
      kicked: <yellow>You have been kicked from <blue>{1}</blue>.</yellow>
      not-in-settlement: <yellow>The player is not a citizen of this settlement.</yellow>
      success: <aqua>Player {1} has been kicked from the settlement.</aqua>
    leave:
      confirm: <aqua>Are you sure you wish leave <blue>{1}</blue>?</aqua>
      is-leader: <yellow>You're the country leader, you can't leave.</yellow>
      is-mayor: <yellow>You're the mayor of this settlement, you can't leave.</yellow>
      settlement-left: <aqua>You have left <blue>{1}</blue>.</aqua>
    not-in-settlement: <yellow>{1} is not a member of the settlement.</yellow>
    permission:
      success: <aqua>Settlement permission {1} for {2} set to {3}.</aqua>
      unknown-membership: "<yellow>Unknown group: {1}.</yellow>"
      unknown-permission: "<yellow>Unknown permission: {1}.</yellow>"
    player-left: <yellow>{1} is not a member of the settlement.</yellow>
    removerank:
      cannot-remove-mayor: <yellow>You cannot remove the mayor rank. You can only
        pass it to another citizen.</yellow>
      lost: <aqua>You lost the settlement rank {1}.
      rank-not-owned: <yellow>Citizen {1} doesn't have the rank {2}.</yellow>
      success: <aqua>Removed settlement rank {1} from {2}.</aqua>
    removetrust:
      not-trusted: <yellow>{1} is not on the trust list.</yellow>
      success: <aqua>Removed {1} from trust list.</aqua>
      untrusted: <aqua>You have lost trust in {1}.</aqua>
    setboard:
      cleared: <aqua>Your settlement's board has been cleared.</aqua>
      success: <aqua>Your settlement''s board has been updated. Use "/settlement setboard
        EMPTY" to clear it.</aqua>
    setcolor:
      success: <aqua>Successfully changed your settlement color to {1}.</aqua>
    setname:
      success: <aqua>Successfully changed your settlement name from {1} to {2}.</aqua>
    setspawn:
      not-in-claims: <yellow>The spawn location must be inside of settlement claims.</yellow>
      success: <aqua>Successfully changed your settlement spawn.</aqua>
    settax:
      above-max: <yellow>You can't set taxes higher than {1}, using maximum allowed
