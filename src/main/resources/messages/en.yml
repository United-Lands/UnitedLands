      not-in-settlement: <yellow>This chunk does not belong to your settlement</yellow>
      success: <aqua>Unclaimed chunk at {1}</aqua>
    usetaxpercent:
      success: <aqua>Percentage tax for {1} is now {2}.</aqua>
    withdraw:
      success: <aqua>You took {1} from the settlement bank.</aqua>
  settlementchunk:
    abandon:
      not-owner: <yellow>You are not the owner of this plot.</yellow>
      success: <aqua>You abandoned this plot.</aqua>
    buy:
      not-for-sale: <yellow>This plot is not for sale.</yellow>
      success: <aqua>You successfully bought the plot for {price}.</aqua>
    evict:
      not-owner: <yellow>This plot is not owned by anyone.</yellow>
      success: <aqua>You evicted the current owner of this plot.</aqua>
