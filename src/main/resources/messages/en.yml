      tp-start: <white>Teleporting in 3 seconds. Move to cancel.</white>
    toggle:
      success: <aqua>Toggled settlement {1} to {2}</aqua>
      unknown-toggle: "<yellow>Unknown toggle: {1}.</yellow>"
    unclaim:
