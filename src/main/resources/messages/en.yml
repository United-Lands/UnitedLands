    and countries...</aqua>
player:
  country:
    addrank:
      target-player-not-in-country: <yellow>Player {1} is not a citizen of {2}.</yellow>
      rank-already-owned: <yellow>{1} already has the rank {2}.</yellow>
      rank-received: <aqua>You've received the country rank of {1}.</aqua>
      confirm-new-leader: <yellow>Are you sure you want to give the leadership to {1} permanently?</yellow>
      success: <aqua>Successfully added rank {1} to {2}.</aqua>
    claim:
      already-being-claimed: <yellow>This region is already being claimed by {1}</yellow>
