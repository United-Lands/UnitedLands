      not-in-settlement: <error>The player is not a citizen of this settlement.</error>
      success: <success>Player {1} has been kicked from the settlement.</success>
    leave:
      confirm: <success>Are you sure you wish leave <blue>{1}</blue>?</success>
      is-leader: <error>You're the country leader, you can't leave.</error>
      is-mayor: <error>You're the mayor of this settlement, you can't leave.</error>
      settlement-left: <success>You have left <blue>{1}</blue>.</success>
    merge:
      broadcast: (missing)
      confirm: (missing)
      mayor-not-online: (missing)
      target-has-country: (missing)
      target-not-in-country: (missing)
    not-in-settlement: <error>{1} is not a member of the settlement.</error>
    permission:
      success: <success>Settlement permission {1} for {2} set to {3}.</success>
      unknown-membership: '<error>Unknown group: {1}.</error>'
      unknown-permission: '<error>Unknown permission: {1}.</error>'
    player-left: <error>{1} is not a member of the settlement.</error>
    removebanish:
      not-banished: <error>{1} is not on the banish list.</error>
      success: <success>Removed {1} from the banish list.</success>
      untrusted: <success>You are no longer banished from in {1}.</success>
    removerank:
      cannot-remove-mayor: <error>You cannot remove the mayor rank. You can only pass it to another citizen.</error>
      lost: <success>You lost the settlement rank {1}.
      rank-not-owned: <error>Citizen {1} doesn't have the rank {2}.</error>
      success: <success>Removed settlement rank {1} from {2}.</success>
    removetrust:
      not-trusted: <error>{1} is not on the trust list.</error>
      success: <success>Removed {1} from trust list.</success>
      untrusted: <success>You have lost trust in {1}.</success>
    setboard:
      cleared: <success>Your settlement's board has been cleared.</success>
      success: <success>Your settlement''s board has been updated. Use "/settlement setboard EMPTY" to clear it.</success>
    setcolor:
      success: <success>Successfully changed your settlement color to {1}.</success>
    setname:
      success: <success>Successfully changed your settlement name from {1} to {2}.</success>
    setspawn:
      not-in-claims: <error>The spawn location must be inside of settlement claims.</error>
      success: <success>Successfully changed your settlement spawn.</success>
    settax:
      above-max: <error>You can't set taxes higher than {1}, using maximum allowed value.</error>
      below-min: <error>You can't set taxes lower than {1}, using minimum allowed value.</error>
      success: <success>Taxes for {1} set to {2}</success>
    spawn:
      no-spawn: <error>The target has no spawn point set.</error>
      not-public: <error>The target spawn is not public.</error>
      tp-cancel: <label>Teleport cancelled.</label>
      tp-start: <label>Teleporting in 3 seconds. Move to cancel.</label>
    toggle:
      success: <success>Toggled settlement flag {1} to {2}</success>
      unknown-toggle: '<error>Unknown toggle: {1}.</error>'
    trustlist: '<success>Trusted players in {1}: <body>{2}</body></success>'
    unclaim:
      has-spawn: <error>Cannot unclaim the chunk that contains the settlement spawn. Move the spawn first.</error>
      has-visitor-spawn: <error>Cannot unclaim the chunk that contains the settlement visitor spawn. Move the spawn first.</error>
      is-home-chunk: <error>You cannot unclaim the settlement's home chunk</error>
      not-claimed: <error>This chunk is not claimed</error>
      not-in-settlement: <error>This chunk does not belong to your settlement</error>
      success: <success>Unclaimed chunk at {2} from {1}</success>
    usetaxpercent:
      success: <success>Percentage tax for {1} is now {2}.</success>
    withdraw:
      success: <success>You took {1} from the settlement bank.</success>
  settlementchunk:
    abandon:
      not-owner: <error>You are not the owner of this plot.</error>
      success: <success>You abandoned this plot.</success>
    buy:
      not-for-sale: <error>This plot is not for sale.</error>
      success: <success>You successfully bought the plot for {price}.</success>
    evict:
      not-owner: <error>This plot is not owned by anyone.</error>
      success: <success>You evicted the current owner of this plot.</success>
    forsale:
      cleared: <success>This plot is no longer for sale.</success>
      has-owner: <error>This plot is already owned by {1}. Evict the current owner before putting this plot up for sale.</error>
      success: <success>This plot is now for sale for {1}. Use [<error>/plot forsale clear</error>] to cancel the sale.</success>
    permission:
      success: <success>Plot permission {1} for {2} set to {3}</success>
    settype:
      success: <success>Set plot to {type}.</success>
      too-many-of-type: <error>The settlement can only have {1} plots of type {2}.</error>
      unknown-type: '<error>Unknown type: {1}.</error>'
    toggle:
      success: <success>Toggled plot {1} to {2}</success>
prefix: <bold><red>U</red><label>L</label> <dark_gray>» </dark_gray></bold>
reload: <success>Plugin reloaded.</success>


