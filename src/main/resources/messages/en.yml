      success: <aqua>Added {1} to trust list.</aqua>
      trusted: <aqua>You have been trusted in {1}.</aqua>
    claim:
      already-claimed: <yellow>This chunk is already claimed.</yellow>
      has-country: <yellow>This region belongs to {1}, and you lack the permission
        to claim here.</yellow>
      outside-of-region: <yellow>You cannot claim outside of your region.</yellow>
      success: <aqua>Claimed chunk {1} for {2} for {3}</aqua>
    create:
      already-claimed: <yellow>This space is already claimed.</yellow>
      already-in-settlement: <yellow>You are already a member of a settlement. Leave
        your current settlement first.</yellow>
      broadcast-message: "<aqua>{1} has just created the settlement of <blue>{2}</blue>
        (Region: <red>{3}</red> | Country: <green>{4}</green>)</aqua>"
      confirm: <aqua>Creating settlement <blue>{1}</blue> here will cost
        {2}. Continue?</aqua>
      country-warning: <yellow>If you make a settlement here, you will automatically
        join the country of <green>{1}</green>.</yellow>
      player-message: <aqua>Congratulations, you have crated the settlement of <bold>{1}</bold>!
        Find out how to manage your town on our /wiki and don't hesitate to ask other
        players in the chat.</aqua>
    delete:
      broadcast-message: <aqua>The settlement of <blue>{1}</blue> has been
        abandoned.</aqua>
      confirm: <aqua>Are you sure you wish to delete <blue>{1}</blue>? <bold>This
        cannot be undone!</bold></aqua>
      is-capital: <yellow>You cannot delete a country capital. Move the capital or
        delete the country first.</yellow>
    deposit:
      success: <aqua>You deposited {1} into the settlement bank.</aqua>
    invite:
