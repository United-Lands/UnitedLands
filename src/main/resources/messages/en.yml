      region-not-owned: <yellow>This region doesn't belong to your country.</yellow>
      success: <aqua>You have forfeited your claims to region {1}.</aqua>
    withdraw:
      success: <aqua>You took {1} from the country bank.</aqua>
  region:
    info:
      not-in-region: <yellow>You're not in a region.</yellow>
    permission:
      success: <aqua>Settlement permission {1} for {2} set to {3}.</aqua>
      unknown-membership: "<yellow>Unknown group: {1}.</yellow>"
      unknown-permission: "<yellow>Unknown permission: {1}.</yellow>"
    setadministrator:
      not-in-country: <yellow>{1} is not part of your country.</yellow>
      success: <aqua>Assigned {1} as the administrator of {2}.</aqua>
    setname:
      success: <aqua>Successfully changed the region name from {1} to {2}.</aqua>
    toggle:
      success: <aqua>Toggled plot {1} to {2}</aqua>
      unknown-toggle: "<yellow>Unknown toggle: {1}"
