  settlement:
    balance: <white><bold>Balance:</bold> {1}</white>
    board: <white><bold>Board:</bold> {1}</white>
    citizens: <white><bold>Citizens:</bold> [<aqua>{1}</aqua>]</white>
    founded: <dark_gray><white><bold>Founded:</bold> {1}</white> | <white><bold>By:</bold>
      {2} </white></dark_gray>
    mayor: <white><bold>Mayor:</bold> {mayor}
