  no-funds-settlement: <yellow>The settlement doesn't have {1} in its bank.</yellow>
  no-permission: <yellow>You don't have permission to perform this action.</yellow>
  no-region-permission: <yellow>You don't have permissions in this region.</yellow>
  no-settlement-permission: <yellow>You don't have the necessary settlement rank do
